<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>이번 학기 — Design Studio</title><link rel="stylesheet" href="style.css"></head><body><aside><a class="brand" href="#">◧ <span>design studio<small>2026 FALL SEMESTER</small></span></a><p class="label">WORKSPACE</p><nav id="nav"></nav><p class="label">COURSES</p><div id="courses"></div><div class="aside-bottom"><span class="avatar">Y</span><div>예준의 스튜디오<small>생각을 다음 작업으로.</small></div></div></aside><main><header><span>내 작업 공간 <b>/</b> 이번 학기</span><span class="save">● 이 브라우저에 자동 저장</span></header><section class="intro"><div><div class="eyebrow">A LITTLE PROGRESS, EVERY DAY</div><h1>이번 학기, 한눈에.</h1><p>흩어진 생각을 정리하고, 다음 할 일에 집중해요.</p></div><button class="primary" id="add">＋ 새 작업</button></section><div id="stats" class="stats"></div><section class="focus"><div><span class="spark">✳</span><div><strong>오늘은 무엇을 풀어볼까요?</strong><p id="focusText"></p></div></div><button id="focusGo">미결정 살펴보기</button></section><section class="workspace"><div class="section-head"><div><h2 id="viewTitle">전체 보드</h2><span id="resultCount"></span></div><div class="tools"><button id="boardToggle" class="selected">▦ 보드</button><button id="listToggle">☰ 목록</button></div></div><div class="filters"><label class="search">⌕ <input id="search" placeholder="작업, 메모 검색"></label><select id="courseFilter"></select><select id="projectFilter"></select><select id="typeFilter"></select><label class="check"><input type="checkbox" id="showDone"> 완료 포함</label><button id="reset" title="필터 초기화">초기화</button></div><p id="viewHint" class="view-hint"></p><div id="board"></div></section><footer>이번 학기의 작은 진전이 모이는 곳.<span>DESIGN STUDIO / 2026</span></footer></main><dialog id="editor"><form id="taskForm"><div class="modal-head"><div><span class="eyebrow">TASK DETAILS</span><h2 id="modalTitle">새 작업</h2></div><button type="button" id="close" class="icon">✕</button></div><label>작업 이름<input name="title" required maxlength="120" placeholder="무엇을 해야 하나요?"></label><div class="form-grid"><label>과목<select name="course"></select></label><label>프로젝트<input name="project" list="projectOptions" required></label><label>구분<select name="bucket"></select></label><label>작업 유형<select name="type"></select></label><label>우선순위<select name="priority"></select></label><label>진행 상태<select name="status"></select></label><label>마감<input type="date" name="due"></label></div><datalist id="projectOptions"></datalist><label>짧은 메모<textarea name="note" rows="2" placeholder="맥락이나 고민을 남겨주세요"></textarea></label><label>다음 행동<textarea name="next" rows="2" placeholder="바로 시작할 수 있는 작은 행동"></textarea></label><div class="modal-foot"><button type="button" id="delete">작업 삭제</button><button class="primary" type="submit">저장하기</button></div></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></body></html>
